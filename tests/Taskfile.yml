# =============================================================================
# RETIRED (compatibility harness for the removed Go backend)
# =============================================================================
# `tests/` was the Go end-to-end harness for `backend-go` (driven by
# `cmd/amirotest`). `backend-go` has been removed and replaced by the Node
# adapter (`adapter/src/server.mjs`). Nothing in the `go run ./cmd/amirotest`
# surface below can run any more, because there is no Go backend for it to
# build, start, or query.
#
# The fixtures, cassettes, and suite/test code are kept as historical
# reference (do not delete them), but the `go run ...` tasks are dead. The
# current test entry points are the `adapter:*` tasks below, run from the
# repository root.
#
# Install: https://taskfile.dev  (or just run the commands in `cmds:`)
version: "3"

tasks:
  default:
    desc: The current tests (Node adapter unit tests)
    cmds: ["node --test adapter/test/usage.test.mjs"]

  adapter:unit:
    desc: Node adapter unit tests
    cmds: ["node --test adapter/test/usage.test.mjs"]

  adapter:live:
    desc: "Adapter live smoke against a RUNNING, AUTHENTICATED preview (needs credentials + a live bridge)"
    cmds: ["node adapter/test/live-smoke.mjs"]

  # ---------------------------------------------------------------------------
  # Everything below is RETIRED. It targeted backend-go and will not run.
  # Kept only so the historical commands are still discoverable.
  # ---------------------------------------------------------------------------

  legacy:doctor:
    desc: "[RETIRED] Was: is the Go toolchain complete?"
    cmds: ["go run ./cmd/amirotest doctor"]

  legacy:list:
    desc: "[RETIRED] Was: every discovered surface/feature/test address"
    cmds: ["go run ./cmd/amirotest list"]

  legacy:run:
    desc: "[RETIRED] Was: everything config.yaml selected"
    cmds: ["go run ./cmd/amirotest run"]

  legacy:smoke:
    desc: "[RETIRED] Was: the minimal per-surface liveness path"
    cmds: ["go run ./cmd/amirotest run --tag smoke"]

  legacy:backend:
    desc: "[RETIRED] Was: the Go backend surface"
    cmds: ["go run ./cmd/amirotest run --surface backend {{if .FEATURE}}--feature {{.FEATURE}}{{end}}"]

  legacy:tui:
    desc: "[RETIRED] Was: the TUI surface"
    cmds: ["go run ./cmd/amirotest run --surface tui {{if .FEATURE}}--feature {{.FEATURE}}{{end}}"]

  legacy:ui:
    desc: "[RETIRED] Was: the web dashboard surface (Playwright)"
    cmds: ["go run ./cmd/amirotest run --surface ui {{if .FEATURE}}--feature {{.FEATURE}}{{end}}"]

  legacy:desktop:
    desc: "[RETIRED] Was: the Tauri surface"
    cmds: ["go run ./cmd/amirotest run --surface desktop"]

  legacy:meta:
    desc: "[RETIRED] Was: guards -- tests of the test system itself"
    cmds: ["go run ./cmd/amirotest run --surface meta"]

  legacy:unit:
    desc: "[RETIRED] Was: the Go harness's own unit tests"
    cmds: ["go test ./harness/... ./cmd/..."]

  legacy:report:
    desc: "[RETIRED] Was: re-render the newest run's summary"
    cmds: ["go run ./cmd/amirotest report"]
