# =============================================================================
# Amiro Test Suite
# =============================================================================
# Amiro is Rust-only on native surfaces (backend/, runtime/, clients/desktop/,
# std-only tests/rust).
#
# Current test surfaces:
# - adapter unit tests: node --test adapter/test/*.test.mjs
# - cargo tests: tests/rust (std-only Rust testkit), clients/desktop
# - vitest: frontend unit and integration tests (pnpm test)
# - e2e: recorded Playwright journeys (pnpm test:e2e), see tests/e2e/README.md
#
# Install Task runner: https://taskfile.dev (or execute commands directly)
version: "3"

tasks:
  default:
    desc: Run standard tests (adapter unit tests and Rust testkit)
    cmds:
      - task: adapter:unit
      - task: cargo:test

  adapter:unit:
    desc: Node adapter unit tests
    cmds:
      - "node --test adapter/test/*.test.mjs"

  adapter:live:
    desc: "Adapter live smoke against a running preview (needs credentials and live bridge)"
    cmds:
      - "node adapter/test/live-smoke.mjs"

  cargo:test:
    desc: Run std-only Rust testkit tests
    dir: tests/rust
    cmds:
      - "cargo test --offline"

  cargo:check:
    desc: Check Rust packages (tests/rust and clients/desktop)
    cmds:
      - "cd tests/rust && cargo test --offline"
      - "cd clients/desktop && cargo check --offline"

  vitest:
    desc: Run frontend unit tests via vitest
    cmds:
      - "pnpm test"

  e2e:
    desc: Recorded Playwright journeys on an isolated instance (video + REVIEW.md)
    cmds:
      - "pnpm exec playwright test {{.CLI_ARGS}}"

  e2e:headed:
    desc: Same, with a visible browser
    cmds:
      - "pnpm exec playwright test --headed {{.CLI_ARGS}}"
