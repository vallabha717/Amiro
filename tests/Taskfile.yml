# =============================================================================
# Amiro Test Suite
# =============================================================================
# The legacy Go backend and Go test harness (cmd/amirotest) have been retired.
# Amiro is now Rust-only on native surfaces (Tauri desktop shell, std-only tests/rust)
# with the Node adapter as the backend runtime.
#
# Current test surfaces:
# - adapter unit tests: node --test adapter/test/*.test.mjs
# - cargo tests: tests/rust (std-only Rust testkit), src-tauri
# - vitest: frontend unit and integration tests (pnpm test)
# - playwright: end-to-end browser tests (pnpm test:e2e or cd tests && pnpm test)
#
# Install Task runner: https://taskfile.dev (or execute commands directly)
version: "3"

tasks:
  default:
    desc: Run standard tests (adapter unit tests and Rust testkit)
    cmds:
      - task: adapter:unit
      - task: cargo:test

  adapter:unit:
    desc: Node adapter unit tests
    cmds:
      - "node --test adapter/test/*.test.mjs"

  adapter:live:
    desc: "Adapter live smoke against a running preview (needs credentials and live bridge)"
    cmds:
      - "node adapter/test/live-smoke.mjs"

  cargo:test:
    desc: Run std-only Rust testkit tests
    dir: tests/rust
    cmds:
      - "cargo test --offline"

  cargo:check:
    desc: Check Rust packages (tests/rust and src-tauri)
    cmds:
      - "cd tests/rust && cargo test --offline"
      - "cd src-tauri && cargo check --offline"

  vitest:
    desc: Run frontend unit tests via vitest
    cmds:
      - "pnpm test"

  playwright:
    desc: Run Playwright end-to-end browser tests
    dir: tests
    cmds:
      - "pnpm playwright test"

  playwright:headed:
    desc: Run Playwright tests with headed browser
    dir: tests
    cmds:
      - "pnpm playwright test --headed"

  # ---------------------------------------------------------------------------
  # LEGACY / RETIRED: Go harness tasks (cmd/amirotest) are dropped.
  # The Go toolchain is no longer required or supported in Amiro.
  # Historical reference only:
  # - legacy:doctor was: go run ./cmd/amirotest doctor
  # - legacy:list was: go run ./cmd/amirotest list
  # - legacy:run was: go run ./cmd/amirotest run
  # - legacy:smoke was: go run ./cmd/amirotest run --tag smoke
  # ---------------------------------------------------------------------------
