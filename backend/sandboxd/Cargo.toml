[package]
name = "amiro-sandboxd"
version = "0.1.0"
edition = "2021"
description = "Amiro sandbox supervisor: one hardened container per team agent"
license = "MIT"

[lib]
name = "sandboxd"
path = "src/lib.rs"

[[bin]]
name = "amiro-sandboxd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
# Docker Engine API over its unix socket. Plain HTTP/1.1, no TLS.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-agent credential: HMAC-SHA256(master, "amiro-agent:" + id).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
base64 = "0.22"
# Client the backend uses to reach the supervisor on loopback.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
