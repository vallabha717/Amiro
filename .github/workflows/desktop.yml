name: Desktop app

# Builds the Tauri desktop app natively on macOS (Apple silicon and Intel),
# Windows and Linux: one installer per platform, amiro-desktop-<os>-<arch>.<ext>,
# plus signed update bundles (.sig) for the app's self-update. release.yml runs
# it for every release; start it by hand (Actions tab) to rebuild one release's
# desktop files or to try a build without a tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to upload the installers to
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag to upload the installers to
        required: false
      only:
        description: Optional platform filter (macos, windows, linux)
        required: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all='[
            {"name":"macOS (Apple silicon)","os":"macos-latest","target":"aarch64-apple-darwin","family":"macos"},
            {"name":"macOS (Intel)","os":"macos-15-intel","target":"x86_64-apple-darwin","family":"macos"},
            {"name":"Windows","os":"windows-latest","target":"x86_64-pc-windows-msvc","family":"windows"},
            {"name":"Linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","family":"linux"}
          ]'
          echo "matrix=$(jq -c --arg only "$ONLY" '{include: [.[] | select($only == "" or .family == $only)]}' <<< "$all")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            backend
            runtime
            clients/desktop

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Backend + runtime sidecars for this platform (Tauri's beforeBuildCommand
      # would do the same; doing it here keeps the logs readable).
      - name: Build sidecars
        run: node scripts/build-sidecar.mjs --build --target ${{ matrix.target }}

      # Sign with a Developer ID when the APPLE_* secrets exist; otherwise
      # ad-hoc sign ("-") so the app still launches on Apple silicon. Empty
      # secrets must not reach Tauri: it would try to import an empty cert.
      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<__AMIRO_EOF__"; echo "${!v}"; echo "__AMIRO_EOF__"; } >> "$GITHUB_ENV"
              fi
            done
            echo "Signing with a Developer ID certificate."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No APPLE_CERTIFICATE secret: ad-hoc signing."
          fi

      # Self-update: with the updater key the build also writes signed update
      # bundles (.sig) that latest.json points at (scripts/updater-manifest.mjs).
      # Without it (forks), turn the updater artifacts off so the build still works.
      - name: Updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            { echo "TAURI_SIGNING_PRIVATE_KEY<<__AMIRO_EOF__"; echo "$TAURI_SIGNING_PRIVATE_KEY"; echo "__AMIRO_EOF__"; } >> "$GITHUB_ENV"
            { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__AMIRO_EOF__"; echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; echo "__AMIRO_EOF__"; } >> "$GITHUB_ENV"
            echo "Signing update bundles."
          else
            conf="$RUNNER_TEMP/no-updater.json"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$conf"
            echo "TAURI_EXTRA_ARGS=--config $conf" >> "$GITHUB_ENV"
            echo "No TAURI_SIGNING_PRIVATE_KEY secret: building without update bundles."
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: --target ${{ matrix.target }} ${{ env.TAURI_EXTRA_ARGS }}

      - name: Collect installers
        shell: bash
        run: |
          bundle="clients/desktop/target/${{ matrix.target }}/release/bundle"
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          mkdir -p dist
          # Signatures (.sig) sign the file's content, so they stay valid
          # under the stable names below.
          sig() { for f in "$@"; do [ -f "$f" ] && return 0; done; return 1; }
          case "${{ matrix.family }}" in
            macos)   cp "$bundle"/dmg/*.dmg "dist/amiro-desktop-macos-$arch.dmg"
                     if sig "$bundle"/macos/*.app.tar.gz.sig; then
                       cp "$bundle"/macos/*.app.tar.gz "dist/amiro-desktop-macos-$arch.app.tar.gz"
                       cp "$bundle"/macos/*.app.tar.gz.sig "dist/amiro-desktop-macos-$arch.app.tar.gz.sig"
                     fi ;;
            windows) cp "$bundle"/nsis/*-setup.exe "dist/amiro-desktop-windows-$arch-setup.exe"
                     if sig "$bundle"/nsis/*-setup.exe.sig; then
                       cp "$bundle"/nsis/*-setup.exe.sig "dist/amiro-desktop-windows-$arch-setup.exe.sig"
                     fi ;;
            linux)   cp "$bundle"/appimage/*.AppImage "dist/amiro-desktop-linux-$arch.AppImage"
                     cp "$bundle"/deb/*.deb "dist/amiro-desktop-linux-$arch.deb"
                     if sig "$bundle"/appimage/*.AppImage.sig; then
                       cp "$bundle"/appimage/*.AppImage.sig "dist/amiro-desktop-linux-$arch.AppImage.sig"
                     fi ;;
          esac
          ls -la dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: amiro-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to the release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber

  # A desktop-only run for a release tag (started by hand) refreshes the
  # release's update feed and checksums. release.yml does this itself in its
  # Publish job when it builds the desktop app as part of a release.
  manifest:
    name: Update feed
    needs: build
    if: ${{ inputs.tag != '' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: latest.json and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p assets && cd assets
          gh release download "$TAG" --pattern 'amiro-*' --pattern install.sh
          node ../scripts/updater-manifest.mjs . "$TAG" "$GITHUB_REPOSITORY"
          sha256sum amiro-* install.sh latest.json > SHA256SUMS
          gh release upload "$TAG" latest.json SHA256SUMS --clobber
      - uses: actions/attest-build-provenance@v2
        with:
          # Every file in assets/ is a release file.
          subject-path: assets/*
