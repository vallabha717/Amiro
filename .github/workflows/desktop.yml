name: Desktop app

# Builds the Tauri desktop app natively on macOS (Apple silicon and Intel),
# Windows and Linux. Runs on demand and on PRs that touch the desktop shell;
# release.yml calls it with a tag to upload the installers. One installer
# per platform, named amiro-desktop-<os>-<arch>.<ext>.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to upload the installers to
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag to upload the installers to
        required: false
      only:
        description: Optional platform filter (macos, windows, linux)
        required: false
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/build-sidecar.mjs"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all='[
            {"name":"macOS (Apple silicon)","os":"macos-latest","target":"aarch64-apple-darwin","family":"macos"},
            {"name":"macOS (Intel)","os":"macos-15-intel","target":"x86_64-apple-darwin","family":"macos"},
            {"name":"Windows","os":"windows-latest","target":"x86_64-pc-windows-msvc","family":"windows"},
            {"name":"Linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","family":"linux"}
          ]'
          echo "matrix=$(jq -c --arg only "$ONLY" '{include: [.[] | select($only == "" or .family == $only)]}' <<< "$all")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10.2.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            backend
            runtime
            src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Backend + runtime sidecars for this platform (Tauri's beforeBuildCommand
      # would do the same; doing it here keeps the logs readable).
      - name: Build sidecars
        run: node scripts/build-sidecar.mjs --build --target ${{ matrix.target }}

      # Sign with a Developer ID when the APPLE_* secrets exist; otherwise
      # ad-hoc sign ("-") so the app still launches on Apple silicon. Empty
      # secrets must not reach Tauri: it would try to import an empty cert.
      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<__AMIRO_EOF__"; echo "${!v}"; echo "__AMIRO_EOF__"; } >> "$GITHUB_ENV"
              fi
            done
            echo "Signing with a Developer ID certificate."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No APPLE_CERTIFICATE secret: ad-hoc signing."
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: --target ${{ matrix.target }}

      - name: Collect installers
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          mkdir -p dist
          case "${{ matrix.family }}" in
            macos)   cp "$bundle"/dmg/*.dmg "dist/amiro-desktop-macos-$arch.dmg" ;;
            windows) cp "$bundle"/nsis/*-setup.exe "dist/amiro-desktop-windows-$arch-setup.exe" ;;
            linux)   cp "$bundle"/appimage/*.AppImage "dist/amiro-desktop-linux-$arch.AppImage"
                     cp "$bundle"/deb/*.deb "dist/amiro-desktop-linux-$arch.deb" ;;
          esac
          ls -la dist

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: amiro-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to the release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
