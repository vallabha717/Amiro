name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (Markdown, the Mintlify site, docs/) skip the heavy jobs.
  # CI itself must still run: branch protection waits for the `required` job.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!docs/**'
              - '!docs.json'
              - '!style.css'
              - '!logo/**'
              - '!.mintignore'
              - '!architecture/**'
              - '!reference/**'
              - '!settings/**'
              - '!using/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  frontend:
    name: Frontend (types, lint, unit tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # pnpm 10.2.1 matches the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.2.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Embedded runtime update contract
        run: node scripts/verify-runtime-update-contract.mjs

      - name: Unit tests
        run: pnpm test

  rust:
    name: Rust (backend tests, runtime check)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Mirrors the conservative fallback in runtime/.cargo/config.toml. Cargo
      # only reads .cargo/config.toml from the working directory upwards, so
      # that file does not apply when cargo is invoked from the repo root.
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            runtime

      - name: Backend tests
        run: cargo test --manifest-path backend/Cargo.toml

      # Same command as the runtime:check script in package.json.
      - name: Runtime check
        run: cargo check --manifest-path runtime/Cargo.toml --bin amiro-runtime --no-default-features

  # The one check branch protection requires (like uv's "all required jobs
  # passed"): add jobs to `needs` instead of editing the ruleset. A job that
  # was skipped because only docs changed counts as passed.
  required:
    name: All required checks passed
    if: always()
    needs: [changes, frontend, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "code changed: $CODE"
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::a required job failed"; exit 1
          fi
          if [ "$CODE" = "true" ] && echo "$RESULTS" | grep -q '"skipped"'; then
            echo "::error::code changed but a required job was skipped"; exit 1
          fi
