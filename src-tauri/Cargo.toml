[package]
name = "amiro"
version = "1.26.0"
description = "Amiro desktop: Tauri shell over the backend sidecar"
authors = ["Amiro"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amiro_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
rand = "0.8"
dotenv = "0.15"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
