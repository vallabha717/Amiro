# tmux for the agent's shared shell (amiro-shell). The pane title is set by
# desktop-bashrc to "<agent> — <folder on the owner's computer>" and passed on
# as the terminal window's title, which amiro-desktop-state reads.
set -g default-terminal "tmux-256color"
set -g history-limit 20000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#T"
set -g allow-rename off
# Size the shared shell to its smallest view (TV window or Debug panel), so
# every view shows all of it.
set -g window-size smallest
set -g aggressive-resize on
set -g status-style "bg=#232329,fg=#d4d4dc"
set -g status-left " "
set -g status-right ""
set -g window-status-format " #I #{b:pane_current_path} "
set -g window-status-current-format "#[bg=#45454f,fg=#ffffff] #I #{b:pane_current_path} "
