[package]
name = "amiro-todo-policy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure todo quality-gate and auto-poke policy shared by Amiro clients"

[dependencies]
amiro-task-types = { path = "../amiro-task-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
amiro-core = { path = "../amiro-core" }
