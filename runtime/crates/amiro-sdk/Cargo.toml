[package]
name = "amiro-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the amiro harness API: connect, drive sessions, stream events"

[dependencies]
anyhow = "1"
amiro-harness-api = { path = "../amiro-harness-api" }
amiro-applet-types = { path = "../amiro-applet-types" }
amiro-todo-policy = { path = "../amiro-todo-policy" }
amiro-provider-metadata = { path = "../amiro-provider-metadata" }
amiro-transport = { path = "../amiro-transport" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
