[package]
name = "amiro-build-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
amiro-core = { path = "../amiro-core" }
amiro-selfdev-types = { path = "../amiro-selfdev-types" }
amiro-storage = { path = "../amiro-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
