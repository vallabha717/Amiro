[package]
name = "amiro-provider-doctor"
version = "0.1.0"
edition = "2024"
publish = false

# Provider diagnostics that sit downstream of amiro-base: the strict
# `amiro provider-doctor` end-to-end runner (provider_e2e), the live provider
# probes it drives, and the auth-lifecycle contract driver. Split out of
# amiro-base so edits to the doctor cluster no longer rebuild the
# base -> app-core -> tui spine, and base compiles faster with lower peak
# memory.

[lib]
name = "amiro_provider_doctor"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# default-features = false: the doctor only needs base's always-on surface
# (auth, provider runtimes, provider_catalog, live_tests). Feature unification
# in the root binary re-enables embeddings/bedrock there.
amiro-base = { path = "../amiro-base", default-features = false }
amiro-provider-gemini-runtime = { path = "../amiro-provider-gemini-runtime" }
amiro-provider-anthropic-runtime = { path = "../amiro-provider-anthropic-runtime" }
amiro-provider-openai-runtime = { path = "../amiro-provider-openai-runtime" }
amiro-provider-openrouter-runtime = { path = "../amiro-provider-openrouter-runtime" }
amiro-provider-cursor-runtime = { path = "../amiro-provider-cursor-runtime" }
amiro-provider-antigravity-runtime = { path = "../amiro-provider-antigravity-runtime" }
amiro-provider-copilot-runtime = { path = "../amiro-provider-copilot-runtime" }

[dev-dependencies]
# The auth-lifecycle driver tests run inside amiro-base's auth test sandbox.
amiro-base = { path = "../amiro-base", version = "0.1.0", default-features = false, features = ["test-support"] }
amiro-provider-metadata = { path = "../amiro-provider-metadata", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt"] }
