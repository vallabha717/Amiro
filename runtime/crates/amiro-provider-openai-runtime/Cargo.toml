[package]
name = "amiro-provider-openai-runtime"
version = "0.1.0"
edition = "2024"
description = "OpenAI provider runtime (Codex OAuth + API key, Responses API over SSE/WebSocket) for amiro, kept downstream of amiro-base so provider edits do not rebuild the app spine"

[lib]
name = "amiro_provider_openai_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
# default-features = false: the top-level binary decides heavy optional base
# features (embeddings/bedrock). Runtime crates must not re-enable them via
# feature unification, or --no-default-features release targets (e.g. Windows
# ARM64, which cannot build tract-linalg asm) break.
amiro-base = { path = "../amiro-base", default-features = false }
amiro-message-types = { path = "../amiro-message-types" }
amiro-provider-core = { path = "../amiro-provider-core" }
amiro-schema-dialect = { path = "../amiro-schema-dialect" }
amiro-provider-openai = { path = "../amiro-provider-openai" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util", "process"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
dirs = "5"
# permessage-deflate WebSocket connector: same TLS stack tokio-tungstenite
# already pulls in, used directly so a compression layer can sit above TLS.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[dev-dependencies]
# The migrated openai tests use amiro-base's test-env sandbox.
amiro-base = { path = "../amiro-base", default-features = false, features = ["test-support"] }
tempfile = "3"
