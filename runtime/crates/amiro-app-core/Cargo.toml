[package]
name = "amiro-app-core"
version = "0.1.0"
edition = "2024"
publish = false

# Application core for amiro: all non-presentation modules (server, agent,
# provider, auth, session, tool, config, etc.) extracted out of the monolithic
# root `amiro` crate so they compile as a separate rustc unit. The root `amiro`
# crate (cli + tui + bin) re-exports this crate's modules via `pub use
# amiro_app_core::*`, preserving every existing `crate::<module>` path.

[lib]
name = "amiro_app_core"
path = "src/lib.rs"

[dependencies]
# NOTE: the jemalloc allocator stats live in `amiro-base` (process_memory) and
# local embeddings live in `amiro-base` (embedding); this crate forwards those
# features to amiro-base rather than depending on the backing crates directly.

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# CLI

# File operations
glob = "0.3"
ignore = "0.4"
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }
amiro-applet-types = { path = "../amiro-applet-types" }

# Embeddings (local inference) live in amiro-base; this crate forwards the
# `embeddings` feature to amiro-base rather than depending on amiro-embedding.
amiro-harness-api = { path = "../amiro-harness-api" }
amiro-productivity-core = { path = "../amiro-productivity-core" }
amiro-import-core = { path = "../amiro-import-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
url = "2"
# Local fallback for the open tool when no `amiro companion` is running.
amiro-desktop-open = { path = "../amiro-desktop-open" }
amiro-agent-runtime = { path = "../amiro-agent-runtime" }
amiro-ambient-types = { path = "../amiro-ambient-types" }
amiro-notify-email = { path = "../amiro-notify-email" }
amiro-provider-core = { path = "../amiro-provider-core" }
amiro-schema-dialect = { path = "../amiro-schema-dialect" }
# NOTE: amiro-app-core does NOT depend on any amiro-tui-* crate. They were
# unused dead dependency edges here (the TUI declares them itself). Removing
# them stops a amiro-tui-* edit from cascading a recompile through app-core.
amiro-update-core = { path = "../amiro-update-core" }

# Streaming
tokio-stream = "0.1"

# NOTE: no ratatui/crossterm here. Terminal rendering and prompts belong to the
# CLI and amiro-tui, so the shared runtime never touches a terminal.

# PDF parsing (behind feature flag)
amiro-pdf = { path = "../amiro-pdf", optional = true }
amiro-build-support = { path = "../amiro-build-support" }
amiro-build-meta = { path = "../amiro-build-meta" }

# Foundational layer (provider, auth, config, session, message, memory, ...).
# Re-exported via `pub use amiro_base::*` in lib.rs. default-features=false so
# this crate controls amiro-base's optional features (see [features] below).
amiro-base = { path = "../amiro-base", default-features = false }
amiro-command-risk = { path = "../amiro-command-risk" }
amiro-core = { path = "../amiro-core" }
amiro-message-types = { path = "../amiro-message-types" }
amiro-overnight-core = { path = "../amiro-overnight-core" }
amiro-plan = { path = "../amiro-plan" }
amiro-swarm-core = { path = "../amiro-swarm-core" }
amiro-selfdev-types = { path = "../amiro-selfdev-types" }
amiro-session-types = { path = "../amiro-session-types" }
amiro-setup-hints = { path = "../amiro-setup-hints" }
amiro-task-types = { path = "../amiro-task-types" }
amiro-tool-core = { path = "../amiro-tool-core" }
amiro-codemode = { path = "../amiro-codemode" }
amiro-tool-types = { path = "../amiro-tool-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.1.7" }

[features]
default = ["pdf", "bedrock"]
# jemalloc allocator stats live in amiro-base (process_memory); forward there.
jemalloc = ["amiro-base/jemalloc"]
jemalloc-prof = ["amiro-base/jemalloc-prof"]
# local embeddings live in amiro-base (embedding); forward there.
embeddings = ["amiro-base/embeddings"]
# live AWS Bedrock support lives in amiro-base (provider/bedrock); forward there.
bedrock = ["amiro-base/bedrock"]
# Used only by the CentOS 7 portable Linux release build.
linux-compat-vendored-openssl = ["amiro-notify-email/linux-compat-vendored-openssl"]
# PDF text extraction lives in this crate (tool/read.rs).
pdf = ["dep:amiro-pdf"]
# Compiles this crate's test-only helpers/accessors (e.g. the
# ExternalAuthReviewCandidate read accessors) as `pub` and forwards
# amiro-base's `test-support` so downstream crates' test targets can reach the
# whole stack's helpers. Never enabled in normal (non-test) builds.
test-support = ["amiro-base/test-support"]

[dev-dependencies]
# Paused-time browser tests must compile when this package is tested alone,
# without inheriting test-util from another workspace package's dev-dependencies.
tokio = { version = "1", features = ["test-util"] }
# Used by async streaming tests (ambient/runner_tests, server/client_actions_tests).
async-stream = "0.3"
# Enables amiro-base's test-support helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests) for
# *this* crate's own test target. Feature unification applies this only to
# test/bench/example builds, not to a normal `cargo build`.
amiro-base = { path = "../amiro-base", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
# Native desktop control for the `macos_computer_use` tool (synthetic mouse/keyboard
# events, cursor positioning, display bounds). `highsierra` enables the
# CGEventCreateScrollWheelEvent2 binding used for scroll.
core-graphics = { version = "0.23", features = ["highsierra"] }
