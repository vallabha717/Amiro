[package]
name = "amiro-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "amiro_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
amiro-base = { path = "../amiro-base", default-features = false }
amiro-core = { path = "../amiro-core" }
amiro-tui-style = { path = "../amiro-tui-style" }
ratatui = "0.30"
serde_json = "1"
