[package]
name = "amiro-provider-openai"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
amiro-core = { path = "../amiro-core" }
amiro-logging = { path = "../amiro-logging" }
amiro-message-types = { path = "../amiro-message-types" }
amiro-provider-core = { path = "../amiro-provider-core" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
