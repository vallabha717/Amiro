[package]
name = "amiro-telemetry-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "amiro_telemetry_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
amiro-build-meta = { path = "../amiro-build-meta" }
amiro-core = { path = "../amiro-core" }
amiro-logging = { path = "../amiro-logging" }
amiro-provider-core = { path = "../amiro-provider-core" }
amiro-selfdev-types = { path = "../amiro-selfdev-types" }
amiro-storage = { path = "../amiro-storage" }
amiro-usage-types = { path = "../amiro-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
sha2 = "0.10"
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
