[package]
name = "amiro-tui-session-picker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
amiro-message-types = { path = "../amiro-message-types" }
amiro-session-types = { path = "../amiro-session-types" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
