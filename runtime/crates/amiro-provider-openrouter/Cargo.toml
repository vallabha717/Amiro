[package]
name = "amiro-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
amiro-schema-dialect = { path = "../amiro-schema-dialect" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
amiro-core = { path = "../amiro-core" }
amiro-logging = { path = "../amiro-logging" }
amiro-message-types = { path = "../amiro-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
