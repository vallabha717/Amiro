[package]
name = "amiro-provider-grok-build-runtime"
version = "0.1.0"
edition = "2024"
description = "Grok Build subscription runtime for amiro over the Grok CLI chat proxy (direct HTTPS)"

[lib]
name = "amiro_provider_grok_build_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
# default-features = false: see amiro-provider-openrouter-runtime/Cargo.toml.
amiro-base = { path = "../amiro-base", default-features = false }
amiro-message-types = { path = "../amiro-message-types" }
amiro-provider-core = { path = "../amiro-provider-core" }
amiro-provider-openrouter-runtime = { path = "../amiro-provider-openrouter-runtime" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
